<!doctype html><html lang="en"><meta charset="utf-8"><title>Orbit capture</title><style>
*{box-sizing:border-box}body{width:310px;margin:0;padding:20px;background:#111319;color:#eceef4;font:14px/1.5 system-ui}h1{font-size:22px;margin:0}p{color:#b8bbc7}input,button{font:inherit;width:100%;padding:9px;border-radius:7px;margin:4px 0}input{background:#20222c;border:1px solid #464854;color:white}button{border:0;background:#ff9b6c;color:#21160f;cursor:pointer;font-weight:650}button:disabled{opacity:.5}button.secondary{background:#272a35;color:#fff}label{display:block}#status{min-height:20px;color:#efb396}a{color:#ffc2a1}</style>
<h1>Orbit Memory</h1><p id="intro">Pair with your local library to start capturing conversations.</p>
<div id="pair"><label>Pairing code<input id="key" type="password" autocomplete="off"></label><button id="saveKey">Pair extension</button></div>
<div id="actions" hidden><button id="recallSite" hidden></button><button id="recall">Load Orbit memory</button><details id="custom" hidden><summary>Configure another AI site</summary><p>Use this for sites with a unique path for each chat. Enter the page’s CSS selectors for complete message bubbles.</p><label>AI name<input id="siteName"></label><label>User message selector<input id="userSelector" value='[data-message-author-role="user"]'></label><label>Assistant message selector<input id="assistantSelector" value='[data-message-author-role="assistant"]'></label></details><button id="connect"></button><button class="secondary" id="selection">Save selected text</button><button class="secondary" id="unpair">Disconnect account</button></div><p id="status" role="status"></p><a href="http://127.0.0.1:47831" target="_blank">Open memory library ↗</a><script src="popup.js"></script></html>
